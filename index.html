
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101019">
  <title>Low Budget Halloween 👻</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #101019;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    main { max-width: 440px; }

    .ghost {
      font-size: 85px;
      animation: float 2.5s ease-in-out infinite;
    }

    h1 {
      color: #b4ff99;
      font-size: clamp(65px, 17vw, 100px);
      margin: 12px 0;
    }

    h2 {
      font-size: 25px;
      line-height: 1.4;
      font-weight: 600;
    }

    p {
      color: #bbbbc8;
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 24px;
      border-radius: 12px;
      background: #b4ff99;
      color: #101019;
      font-weight: bold;
      text-decoration: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ghost { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="ghost">👻</div>

    <h1>BOO!</h1>

    <h2>
      Sorry, my budget for this year
      was quite limited.
    </h2>

    <p>
      But hey, at least my costume
      has a website.
    </p>

    <a href="https://www.instagram.com/edw_7/"
       target="_blank"
       rel="noopener noreferrer">
      Follow the ghost's human ↗
    </a>
  </main>
</body>
</html>

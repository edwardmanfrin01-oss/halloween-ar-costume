<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101019">
  <title>The ghost has ghosted. Have a cookie.</title>
  <meta name="description" content="Halloween is over. The treats aren't. A little cookie for your curiosity.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 32px 24px; background: #101019; color: #faf8ef; font: 16px/1.6 system-ui, sans-serif; display: grid; place-items: center; text-align: center; }
    main { width: 100%; max-width: 460px; }
    .eyebrow { color: #b4ff99; text-transform: uppercase; letter-spacing: .2em; font-size: 11px; font-weight: 700; }
    h1 { font-size: clamp(38px, 10vw, 56px); line-height: 1.08; letter-spacing: -.045em; margin: 20px 0 16px; }
    .intro { color: #c5c3cf; margin: 0; }
    .stage { position: relative; height: 290px; display: grid; place-items: center; isolation: isolate; }
    .stage::before { content: ''; position: absolute; inset: 10px; z-index: -1; background: radial-gradient(ellipse, #b4ff991c, transparent 65%); }
    .shadow { position: absolute; bottom: 27px; width: 125px; height: 14px; border-radius: 50%; background: #0006; filter: blur(6px); }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible, a:focus-visible { outline: 3px solid #b4ff99; outline-offset: 7px; }
    .cookie { border: 0; padding: 12px; background: transparent; width: 232px; height: 232px; animation: float 3.5s ease-in-out infinite; }
    .cookie svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 12px #0004); transition: scale .15s; }
    .cookie:active svg { scale: .94; }
    .cookie:disabled { cursor: default; }
    .cookie.finished svg { visibility: hidden; }
    .bite { display: none; }
    .bite.visible { display: initial; }
    .brows { opacity: 0; }
    .annoyed .brows { opacity: 1; }
    .crumb { position: absolute; left: 50%; top: 48%; width: var(--size); height: var(--size); background: #dc9e52; border-radius: 3px; pointer-events: none; animation: scatter .8s ease-out forwards; }
    #status { min-height: 52px; margin: 0; color: #e6d5b4; font-size: 15px; }
    #again { border: 1px solid #b4ff9950; border-radius: 999px; background: #b4ff99; color: #101019; padding: 11px 26px; font-weight: 700; }
    .actions { min-height: 62px; }
    [hidden] { display: none !important; }
    footer { margin-top: 24px; }
    .social { display: inline-flex; align-items: center; gap: 8px; color: #b4ff99; font-size: 13px; text-underline-offset: 4px; }
    .social img { width: 18px; height: 18px; }
    .note { color: #858390; font-size: 11px; margin-top: 10px; }
    @keyframes float { 0%,100% { transform: translateY(3px) rotate(-7deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
    @keyframes scatter { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .crumb { display: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Halloween is over. The treats aren't.</p>
    <h1>The ghost<br>has ghosted.</h1>
    <p class="intro">But it left you a cookie.<br>Go on, take a bite.</p>
    <div class="stage">
      <div class="shadow" aria-hidden="true"></div>
      <button class="cookie" id="cookie" type="button" aria-label="Take a bite of the cookie" disabled>
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <radialGradient id="dough" cx="40%" cy="32%" r="70%"><stop stop-color="#f6d18c"/><stop offset="1" stop-color="#ce893d"/></radialGradient>
            <mask id="bites" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="220">
              <rect width="220" height="220" fill="white"/>
              <g fill="black">
                <g class="bite" id="bite1"><circle cx="181" cy="43" r="39"/><circle cx="202" cy="78" r="31"/><circle cx="149" cy="23" r="27"/></g>
                <g class="bite" id="bite2"><circle cx="45" cy="151" r="56"/><circle cx="79" cy="188" r="43"/><circle cx="19" cy="106" r="32"/></g>
              </g>
            </mask>
          </defs>
          <g mask="url(#bites)">
            <path d="M110 15C137 10 154 23 174 38S202 75 204 103S197 151 181 172S137 204 110 204S62 194 41 176S14 134 15 109S23 61 43 42S82 13 110 15Z" fill="url(#dough)" stroke="#a96830" stroke-width="5"/>
            <path d="M43 65Q62 29 109 28" fill="none" stroke="#ffe4ad" stroke-width="5" stroke-linecap="round" opacity=".65"/>
            <g fill="#613b2b" stroke="#4b2b23" stroke-width="2" stroke-linejoin="round">
              <path d="m65 50 13-3 6 13-14 6-9-7Z"/><path d="m129 39 13 5-3 14-15-3Z"/><path d="m170 85 12-4 6 13-13 8-8-7Z"/><path d="m41 101 12-6 7 12-8 11-12-4Z"/><path d="m91 160 14-5 7 15-14 9-11-7Z"/><path d="m151 147 16 2-1 15-14 3-5-11Z"/><path d="m57 153 10-4 5 10-10 7Z"/>
            </g>
            <g fill="#aa7037" opacity=".5"><circle cx="99" cy="44" r="2"/><circle cx="155" cy="71" r="3"/><circle cx="73" cy="84" r="2"/><circle cx="128" cy="178" r="3"/><circle cx="183" cy="126" r="2"/><circle cx="72" cy="132" r="2"/></g>
            <g fill="#33251f"><ellipse cx="91" cy="105" rx="5" ry="7"/><ellipse cx="131" cy="105" rx="5" ry="7"/></g>
            <g fill="#fff3d7"><circle cx="92" cy="103" r="1.5"/><circle cx="132" cy="103" r="1.5"/></g>
            <g class="brows" stroke="#33251f" stroke-width="4" stroke-linecap="round"><path d="m82 88 15 6M125 94l15-6"/></g>
            <path id="mouth" d="M103 122q8 10 16 0" fill="none" stroke="#33251f" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">A little treat for your curiosity.</p>
    <div class="actions"><button id="again" type="button" hidden>One more?</button></div>
    <noscript><p>This one's yours to admire. Enable JavaScript to take a bite!</p></noscript>
    <footer>
      <a class="social" href="https://www.instagram.com/edw_7/" target="_blank" rel="noopener noreferrer"><img src="assets/images/instagram-logo.webp" width="18" height="18" alt="">Follow the ghost's human</a>
      <p class="note">Zero calories. Slightly haunted.</p>
    </footer>
  </main>
  <script>
    const cookie = document.getElementById('cookie');
    const status = document.getElementById('status');
    const again = document.getElementById('again');
    const mouth = document.getElementById('mouth');
    const stage = document.querySelector('.stage');
    let bites = 0;
    cookie.disabled = false;
    function crumbs() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (let i = 0; i < 12; i++) {
        const crumb = document.createElement('span');
        crumb.className = 'crumb';
        crumb.setAttribute('aria-hidden', 'true');
        crumb.style.setProperty('--size', `${4 + Math.random() * 6}px`);
        crumb.style.setProperty('--x', `${(Math.random() - .5) * 260}px`);
        crumb.style.setProperty('--y', `${60 + Math.random() * 100}px`);
        crumb.style.setProperty('--r', `${Math.random() * 360}deg`);
        stage.appendChild(crumb);
        setTimeout(() => crumb.remove(), 850);
      }
    }
    cookie.addEventListener('click', () => {
      if (bites >= 3) return;
      bites++;
      crumbs();
      cookie.classList.add('annoyed');
      mouth.setAttribute('d', 'M104 126q7-5 14 0');
      if (bites < 3) {
        document.getElementById(`bite${bites}`).classList.add('visible');
        status.textContent = bites === 1 ? 'Hey. That was my good side.' : 'Okay. In for a penny, in for a cookie.';
        cookie.setAttribute('aria-label', `Take another bite. ${3 - bites} ${bites === 1 ? 'bites' : 'bite'} left.`);
      } else {
        cookie.classList.add('finished');
        cookie.disabled = true;
        status.textContent = 'You came for a ghost. You left with a snack.';
        again.hidden = false;
        again.focus({ preventScroll: true });
      }
    });
    again.addEventListener('click', () => {
      bites = 0;
      document.querySelectorAll('.bite').forEach(bite => bite.classList.remove('visible'));
      cookie.classList.remove('annoyed', 'finished');
      cookie.disabled = false;
      cookie.setAttribute('aria-label', 'Take a bite of the cookie');
      mouth.setAttribute('d', 'M103 122q8 10 16 0');
      status.textContent = 'Another cookie. The ghost will never know.';
      again.hidden = true;
      cookie.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
